name: Daily CPI Tracker Update

on:
  schedule:
    # Run every day at 12:00 UTC (8:00 AM local time in Bolivia)
    - cron: '0 12 * * *'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  update-cpi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Supermarket 2 Tracker
        run: python scripts/daily_tracker_supermarket_2.py
        
      - name: Run Supermarket 1 Tracker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/daily_tracker_supermarket_1.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add results/
                    git add mappings/
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily CPI update" && git push)
